<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4fbff"><title>Escáner QR · Jornario</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script><style>
:root{font-family:Inter,system-ui,sans-serif;color:#112a46;background:#f4fbff;font-synthesis:none}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 80% 10%,#dff6ff 0,transparent 38%),linear-gradient(160deg,#fff 0%,#f4fbff 58%,#e5f7ff 100%)}main{width:min(100%,520px);text-align:center}.brand{font-size:21px;font-weight:700;letter-spacing:.12em;color:#0878ed;margin-bottom:24px}.card{padding:26px;border:1px solid #d9effc;border-radius:26px;background:rgba(255,255,255,.94);box-shadow:0 20px 50px rgba(17,42,70,.12)}h1{font-size:24px;line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.035em}.intro{color:#526b84;font-size:15px;line-height:1.5;margin:0 0 22px}.view{position:relative;overflow:hidden;width:100%;aspect-ratio:1/1;max-height:400px;border-radius:20px;background:#10243b;display:grid;place-items:center}video{width:100%;height:100%;object-fit:cover}.frame{position:absolute;width:min(68%,260px);aspect-ratio:1;pointer-events:none}.corner{position:absolute;width:34px;height:34px;border-color:#48c5fa;border-style:solid;filter:drop-shadow(0 0 5px rgba(72,197,250,.7))}.tl{top:0;left:0;border-width:4px 0 0 4px;border-radius:12px 0 0}.tr{top:0;right:0;border-width:4px 4px 0 0;border-radius:0 12px 0 0}.bl{bottom:0;left:0;border-width:0 0 4px 4px;border-radius:0 0 0 12px}.br{bottom:0;right:0;border-width:0 4px 4px 0;border-radius:0 0 12px}.beam{position:absolute;left:8%;right:8%;height:2px;top:10%;background:linear-gradient(90deg,transparent,#65d5ff 25%,#fff 50%,#65d5ff 75%,transparent);box-shadow:0 0 12px #45bff5;animation:scan 2.3s ease-in-out infinite alternate}@keyframes scan{to{top:90%}}.status{min-height:24px;margin:16px 0;color:#526b84;font-size:14px}.status.error{color:#b42318}button{min-height:48px;padding:0 22px;border:1px solid #78cfff;border-radius:15px;background:linear-gradient(110deg,#1976f3,#57c7f3);color:white;font:600 15px Inter,system-ui,sans-serif;box-shadow:0 8px 20px rgba(25,118,243,.2);cursor:pointer}.privacy{margin:16px 0 0;font-size:12px;color:#657d94}@media(max-width:520px){body{padding:14px}.card{padding:20px}.view{max-height:calc(100vw - 70px)}h1{font-size:22px}}@media(prefers-reduced-motion:reduce){.beam{animation:none;top:50%}}
</style></head><body><main><div class="brand" aria-label="Jornario">JORNARIO</div><section class="card" aria-labelledby="title"><h1 id="title">Escanea tu QR personal</h1><p class="intro">Coloca el código dentro del marco y mantenlo quieto un momento.</p><div class="view"><video id="video" playsinline muted aria-label="Vista de la cámara"></video><div class="frame" aria-hidden="true"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><i class="beam"></i></div></div><p id="status" class="status" role="status" aria-live="polite">Solicitando acceso a la cámara…</p><button id="cancel" type="button">Cancelar escaneo</button><p class="privacy">La lectura se procesa en este dispositivo.</p></section><canvas id="canvas" hidden></canvas></main><script>
(()=>{const video=document.getElementById('video'),canvas=document.getElementById('canvas'),status=document.getElementById('status'),cancel=document.getElementById('cancel'),parameters=new URLSearchParams(location.search),nonce=parameters.get('nonce')||'',returnOrigin=parameters.get('origin')||'';let stream=null,frame=0,finished=false;function stop(){if(frame)cancelAnimationFrame(frame);frame=0;if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}video.srcObject=null}function send(type,value){if(finished)return;finished=true;stop();try{const target=new URL(returnOrigin);if(target.protocol==='https:'&&target.origin===returnOrigin&&window.opener&&!window.opener.closed)window.opener.postMessage({type:'jornario-qr-scanner',nonce,typeResult:type,value:value||''},target.origin)}catch(error){}status.textContent=type==='result'?'Código leído. Volviendo al fichaje…':'Escaneo cancelado.';setTimeout(()=>window.close(),250)}function scan(){if(finished)return;if(video.readyState>=2&&video.videoWidth){canvas.width=video.videoWidth;canvas.height=video.videoHeight;const context=canvas.getContext('2d',{willReadFrequently:true});context.drawImage(video,0,0,canvas.width,canvas.height);const image=context.getImageData(0,0,canvas.width,canvas.height),result=window.jsQR&&jsQR(image.data,image.width,image.height,{inversionAttempts:'dontInvert'});if(result&&result.data){send('result',result.data);return}}frame=requestAnimationFrame(scan)}cancel.addEventListener('click',()=>send('cancel'));if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status.textContent='Este navegador no ofrece acceso a la cámara. Abre el escáner en Chrome o Safari con HTTPS.';status.classList.add('error')}else navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(media=>{stream=media;video.srcObject=media;return video.play()}).then(()=>{status.textContent='Buscando el código QR…';scan()}).catch(error=>{status.textContent=error&&error.name==='NotAllowedError'?'No se concedió permiso para usar la cámara. Permítelo en el navegador e inténtalo de nuevo.':'No se pudo iniciar la cámara. Comprueba que ninguna otra app la esté usando.';status.classList.add('error')})})();
</script></body></html>
